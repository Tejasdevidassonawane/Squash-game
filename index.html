<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elite Squash Academy — Rally Game</title>
<style>
  body{background:#111;display:flex;flex-direction:column;align-items:center;font-family:sans-serif;padding:20px;margin:0;}
  h1{color:#fff;font-size:18px;font-weight:500;}
  p{color:#ccc;font-size:14px;margin:0 0 10px;}
  canvas{border-radius:8px;border:1px solid #333;touch-action:none;cursor:none;}
  #hud{display:flex;gap:24px;margin-top:10px;color:#fff;font-size:14px;}
  button{margin-top:10px;padding:8px 16px;border-radius:6px;border:1px solid #555;background:#222;color:#fff;cursor:pointer;}
  button:hover{background:#333;}
</style>
</head>
<body>
<h1>Elite Squash Academy — Rally Game</h1>
<p>Move mouse to position. Click to serve. Take turns with Player 2 — miss your turn and you lose the point.</p>
<canvas id="cv" width="640" height="460"></canvas>
<div id="hud">
  <span>You (01): <b id="pscore">0</b></span>
  <span>Player 2: <b id="ascore">0</b></span>
</div>
<button id="restart">Restart match</button>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=640,H=460;
const FRONT_Y=30, BACK_Y=440, VANISH_X=320;
const WALL_LIMIT=150;
const WALL_ENERGY=0.85;
function persp(y){ return 0.35 + 0.65*((y-FRONT_Y)/(BACK_Y-FRONT_Y)); }
function xAt(worldX,y){ return VANISH_X + worldX*persp(y); }

const SHARE_Y=340;
let pscore=0,ascore=0,gameOver=false;
let player={wx:60}, ai={wx:0,targetWx:0};
let ball, serving=true, servingWho='player', turn='player';
let flash=0;

function newRally(server){
  servingWho=server;
  turn=server;
  serving=true;
  ball={wx:(server==='player'?player.wx:ai.wx),y:SHARE_Y,vx:0,dir:1};
}
newRally('player');

function drawBG(){ ctx.fillStyle='#f3efe6';ctx.fillRect(0,0,W,H); }

function drawCourt(){
  ctx.fillStyle='#dcd5c4';
  ctx.fillRect(xAt(-320,BACK_Y),BACK_Y-6,xAt(320,BACK_Y)-xAt(-320,BACK_Y),6);
  ctx.fillStyle='#e6e1d3';
  ctx.beginPath();ctx.moveTo(xAt(-160,FRONT_Y),FRONT_Y);ctx.lineTo(xAt(-320,BACK_Y),BACK_Y);ctx.lineTo(0,BACK_Y);ctx.lineTo(xAt(-160,FRONT_Y),FRONT_Y);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(xAt(160,FRONT_Y),FRONT_Y);ctx.lineTo(xAt(320,BACK_Y),BACK_Y);ctx.lineTo(W,BACK_Y);ctx.lineTo(xAt(160,FRONT_Y),FRONT_Y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#c22';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(xAt(-160,FRONT_Y),FRONT_Y+45);ctx.lineTo(xAt(-320,BACK_Y-30),BACK_Y-30);ctx.stroke();
  ctx.beginPath();ctx.moveTo(xAt(160,FRONT_Y),FRONT_Y+45);ctx.lineTo(xAt(320,BACK_Y-30),BACK_Y-30);ctx.stroke();
  ctx.strokeStyle='rgba(180,30,30,0.6)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(xAt(-160,FRONT_Y),FRONT_Y+80);ctx.lineTo(xAt(-320,BACK_Y-70),BACK_Y-70);ctx.stroke();
  ctx.beginPath();ctx.moveTo(xAt(160,FRONT_Y),FRONT_Y+80);ctx.lineTo(xAt(320,BACK_Y-70),BACK_Y-70);ctx.stroke();
  ctx.fillStyle=flash>0?'#fff8e0':'#f7f4ec';
  ctx.fillRect(xAt(-160,FRONT_Y),0,xAt(160,FRONT_Y)-xAt(-160,FRONT_Y),FRONT_Y);
  ctx.strokeStyle='#c22';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(xAt(-160,FRONT_Y),FRONT_Y*0.25);ctx.lineTo(xAt(160,FRONT_Y),FRONT_Y*0.25);ctx.stroke();
  ctx.strokeStyle='#8a1f1c';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(xAt(-160,FRONT_Y),FRONT_Y);ctx.lineTo(xAt(160,FRONT_Y),FRONT_Y);ctx.stroke();
  ctx.fillStyle='#1c1c1c';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
  ctx.fillText('ELITE SQUASH ACADEMY',W/2,BACK_Y-9);
  let fg=ctx.createLinearGradient(0,FRONT_Y,0,BACK_Y);
  fg.addColorStop(0,'#ecd6a3');fg.addColorStop(1,'#d1a565');
  ctx.fillStyle=fg;
  ctx.beginPath();ctx.moveTo(xAt(-160,FRONT_Y),FRONT_Y);ctx.lineTo(xAt(160,FRONT_Y),FRONT_Y);ctx.lineTo(xAt(320,BACK_Y),BACK_Y);ctx.lineTo(xAt(-320,BACK_Y),BACK_Y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(150,110,60,0.2)';ctx.lineWidth=1;
  for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(xAt(i*50,FRONT_Y),FRONT_Y);ctx.lineTo(xAt(i*90,BACK_Y),BACK_Y);ctx.stroke();}
  const shortY=(FRONT_Y+BACK_Y)/2 - 10;
  ctx.strokeStyle='#c22';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(xAt(-160,shortY),shortY);ctx.lineTo(xAt(160,shortY),shortY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(xAt(0,shortY),shortY);ctx.lineTo(xAt(0,BACK_Y),BACK_Y);ctx.stroke();
  const boxY=BACK_Y-40;
  ctx.beginPath();ctx.moveTo(xAt(-160,shortY),shortY);ctx.lineTo(xAt(-140,boxY),boxY);ctx.lineTo(xAt(0,boxY),boxY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(xAt(160,shortY),shortY);ctx.lineTo(xAt(140,boxY),boxY);ctx.lineTo(xAt(0,boxY),boxY);ctx.stroke();
}

function drawPlayer(sx,sy,scale,facingRight,white,active){
  ctx.save();ctx.translate(sx,sy);ctx.scale(scale,scale);
  if(active){ ctx.beginPath();ctx.arc(0,10,20,0,Math.PI*2);ctx.strokeStyle='rgba(200,30,30,0.5)';ctx.lineWidth=2;ctx.stroke(); }
  ctx.strokeStyle=white?'#f5f5f0':'#2c3e50';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-6,14);ctx.lineTo(-9,40);ctx.moveTo(6,14);ctx.lineTo(9,40);ctx.stroke();
  ctx.fillStyle='#2a2a2a';ctx.fillRect(-13,40,7,5);ctx.fillRect(6,40,7,5);
  ctx.fillStyle=white?'#f7f7f2':'#3a7bd5';
  ctx.beginPath();ctx.moveTo(-15,-14);ctx.lineTo(15,-14);ctx.lineTo(11,16);ctx.lineTo(-11,16);ctx.closePath();ctx.fill();
  if(white){ctx.fillStyle='#c22';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText('01',0,4);}
  ctx.fillStyle='#2b2119';
  ctx.beginPath();ctx.arc(0,-26,11,0,Math.PI*2);ctx.fill();
  const dir=facingRight?1:-1;
  ctx.strokeStyle=white?'#f7f7f2':'#3a7bd5';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(11*dir,-8);ctx.lineTo(30*dir,-20);ctx.stroke();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.ellipse(34*dir,-26,9,14,0.3*dir,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function drawBall(bx,by,scale){
  ctx.beginPath();ctx.arc(bx,by,7*scale,0,Math.PI*2);
  ctx.fillStyle='#111';ctx.fill();
  ctx.fillStyle='#f4d03f';
  ctx.beginPath();ctx.arc(bx-2*scale,by-1.6*scale,1.4*scale,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+2*scale,by+1.6*scale,1.4*scale,0,Math.PI*2);ctx.fill();
}

function drawHUD(){
  ctx.fillStyle='#1c1c1c';ctx.font='13px sans-serif';ctx.textAlign='left';
  if(serving){
    const msg = servingWho==='player' ? 'Click court to serve' : 'Player 2 serves';
    ctx.fillText(msg,14,20);
  } else {
    const msg = turn==='player' ? 'Your shot' : 'Player 2 shot';
    ctx.fillText(msg,14,20);
  }
}

function pointWon(who){
  if(who==='player'){pscore++;document.getElementById('pscore').textContent=pscore;}
  else{ascore++;document.getElementById('ascore').textContent=ascore;}
  if(pscore>=5||ascore>=5){gameOver=true;return;}
  newRally(who);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawBG();
  if(flash>0)flash--;
  drawCourt();
  drawHUD();

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='22px sans-serif';ctx.textAlign='center';
    ctx.fillText(pscore>ascore?'You win the match!':'Player 2 wins the match',W/2,H/2);
    ctx.font='14px sans-serif';
    ctx.fillText('Click Restart match to play again',W/2,H/2+28);
    requestAnimationFrame(loop);
    return;
  }

  if(!serving){
    ball.y -= ball.dir*3.8;
    ball.wx += ball.vx;
    if(ball.wx<=-WALL_LIMIT){ ball.wx=-WALL_LIMIT; ball.vx=Math.abs(ball.vx)*WALL_ENERGY; flash=4; }
    if(ball.wx>=WALL_LIMIT){ ball.wx=WALL_LIMIT; ball.vx=-Math.abs(ball.vx)*WALL_ENERGY; flash=4; }

    if(ball.dir===1 && ball.y<=FRONT_Y+5){
      ball.y=FRONT_Y+5; ball.dir=-1; ball.vx*=WALL_ENERGY; flash=6;
    }

    if(turn==='ai'){
      ai.targetWx=ball.wx;
      ai.wx += (ai.targetWx-ai.wx)*0.13;
    } else {
      ai.targetWx=0; ai.wx += (ai.targetWx-ai.wx)*0.04;
    }

    if(ball.dir===-1 && ball.y>=SHARE_Y-20 && ball.y<SHARE_Y+5){
      if(turn==='ai' && Math.abs(ai.wx-ball.wx)<45){
        ball.dir=1; ball.vx += (Math.random()-0.5)*1.3; ball.y=SHARE_Y-25;
        turn='player';
      } else if(turn==='player' && Math.abs(player.wx-ball.wx)<45){
        ball.dir=1; ball.vx += (Math.random()-0.5)*1.6; ball.y=SHARE_Y-25;
        turn='ai';
      } else if(ball.y>=SHARE_Y-2){
        pointWon(turn==='ai'?'player':'ai');
      }
    }
  } else {
    ball.wx = servingWho==='player'?player.wx:ai.wx;
    ball.y = SHARE_Y;
  }

  const s=persp(ball.y);
  drawPlayer(xAt(ai.wx,SHARE_Y),SHARE_Y,0.85+0.4*persp(SHARE_Y),true,false,turn==='ai'&&!serving);
  drawBall(xAt(ball.wx,ball.y),ball.y,s);
  drawPlayer(xAt(player.wx,SHARE_Y),SHARE_Y,0.9+0.45*persp(SHARE_Y),false,true,turn==='player'&&!serving);

  requestAnimationFrame(loop);
}
loop();

function updatePlayer(clientX){
  const rect=cv.getBoundingClientRect();
  const scaleX=W/rect.width;
  const mx=(clientX-rect.left)*scaleX;
  const s=persp(SHARE_Y);
  player.wx=Math.max(-150,Math.min(150,(mx-VANISH_X)/s));
}
cv.addEventListener('mousemove',e=>updatePlayer(e.clientX));
cv.addEventListener('touchmove',e=>{e.preventDefault();updatePlayer(e.touches[0].clientX);},{passive:false});
cv.addEventListener('click',()=>{
  if(gameOver)return;
  if(serving && servingWho==='player'){ serving=false; ball.vx=(Math.random()-0.5)*3.5; ball.dir=1; turn='ai'; }
});
document.getElementById('restart').onclick=()=>{
  pscore=0;ascore=0;gameOver=false;
  document.getElementById('pscore').textContent=0;
  document.getElementById('ascore').textContent=0;
  newRally('player');
};

setInterval(()=>{
  if(serving && servingWho==='ai' && !gameOver){
    serving=false; ball.vx=(Math.random()-0.5)*3.5; ball.dir=1; turn='player';
  }
},900);
</script>
</body>
</html>
